# rfmesh-demo-replay -- top-level demo orchestrator app.
#
# Architectural home: docs/design/ops-architecture.md §1.5 + §2.4.
# Unlike packages/rfmesh-*, apps/* sits OUTSIDE the import-linter
# `root_packages` list -- the demo-replay app is the one place where
# importing from every workspace package is intentional. Package name
# is `rfmesh_demo_replay` (not `rfmesh_*`), so the independence
# contracts do not match by construction.
#
# Owned by lead-Opus. Edits via the standard ticket path.

[project]
name = "rfmesh-demo-replay"
version = "0.1.0"
description = "Multi-node demo orchestrator + recorded-IQ replay app for the rfmesh BoTH3 jury demo."
requires-python = ">=3.12"
# Runtime deps -- depends on every rfmesh workspace package by design
# (composition over every layer). pyyaml + numpy come transitively through
# rfmesh-node / rfmesh-sdr, but we name them explicitly because the
# scenario loader and recorder use them directly.
dependencies = [
    "rfmesh-contracts",
    "rfmesh-sdr",
    "rfmesh-dsp",
    "rfmesh-fusion",
    "rfmesh-cot",
    "rfmesh-node",
    "rfmesh-ops",
    "numpy>=2.1",
    "pyyaml>=6.0",
]

[project.scripts]
rfmesh-demo-replay = "rfmesh_demo_replay.cli.run_replay:run_replay_main"
rfmesh-demo-record = "rfmesh_demo_replay.cli.run_record:run_record_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_demo_replay"]
