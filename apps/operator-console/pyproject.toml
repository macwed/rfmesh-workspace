# rfmesh-operator-console -- click-the-map operator console (apps/*).
#
# Composition root: importing rfmesh_cot is intentional and outside the
# import-linter star discipline (package name is not rfmesh_*-in-the-
# contracts-list, same carve-out as apps/demo-replay). Owned by lead-Opus.

[project]
name = "rfmesh-operator-console"
version = "0.1.0"
description = "Web map console for operator-authored TAK/CoT markers (point + area + note)."
requires-python = ">=3.12"
dependencies = [
    "rfmesh-contracts",
    "rfmesh-cot",
    "aiohttp>=3.9",
]

[project.scripts]
rfmesh-operator-console = "rfmesh_operator_console.cli.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_operator_console"]
