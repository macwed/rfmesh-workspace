# rfmesh-cot -- Workstream C+D: CoT/ATAK publisher.
#
# Owned by Workstream C+D (Opus-CD). Lead-only changes to this file.
# Workstream agents: propose dependency additions via /uvadd-request (AGENTS.md §3).

[project]
name = "rfmesh-cot"
version = "0.1.0"
description = "CoT/ATAK publisher (PyTAK adapter) for rfmesh FixEvent output."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    "pytak>=6,<7",
    "rfmesh-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_cot"]
