# rfmesh-dsss -- DSSS directional-comms DSP for rfmesh (ADR-025).
#
# Pure-Python physical layer: m-sequence PN generation, BPSK modulation,
# spread/despread, correlation, chip/symbol timing recovery, framing
# (preamble + sync + header + payload + CRC), and link-budget honesty.
#
# Invariant B5: this package must be pure -- no network, no file I/O
# (beyond vendor data tables at import, of which there are none), no
# subprocess, no SDR access. The whole DSSS stack runs end-to-end in
# pytest against rfmesh-sdr's SyntheticTransmitter + loopback_channel
# (Iter 3), with zero hardware.
#
# Workspace-discipline reminder (WD-2): every new function requires a
# golden-file test in tests/golden/. Iter 0 (this ADR) lands the
# package skeleton only; module bodies are filled in Iter 1+.
#
# Lead-only changes to this file. Workstream agents propose
# dependency additions via /uvadd-request (AGENTS.md §3).

[project]
name = "rfmesh-dsss"
version = "0.1.0"
description = "DSSS directional-comms DSP (ADR-025): PN sequences, BPSK, spread/despread, framing, link budget."
requires-python = ">=3.12"
dependencies = [
    "rfmesh-contracts",
    "numpy>=2.1",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_dsss"]
