# rfmesh-fusion -- Workstream C+D: Stansfield WLS cross-fix, GDOP, and FixEvent publisher.
#
# Owned by Workstream C+D (Opus-CD). Lead-only changes to this file.
# Workstream agents: propose dependency additions via /uvadd-request (AGENTS.md §3).
# Invariant 5: this package must be pure -- no network, no file I/O, no subprocess,
# no SDR access. Must run end-to-end in pytest with no hardware.

[project]
name = "rfmesh-fusion"
version = "0.1.0"
description = "Bearing cross-fix (Stansfield WLS + MLE), GDOP, and confidence-ellipse computation for rfmesh."
requires-python = ">=3.12"
dependencies = [
    "rfmesh-contracts",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_fusion"]

# Local pytest configuration. The workspace root pyproject also
# registers ``slow`` workspace-wide, but per the WS-CD-003 ticket we
# pin the marker at the package level too so a downstream ticket that
# runs ``uv run pytest packages/rfmesh-fusion -m "not slow"`` reads
# the registration without relying on workspace inheritance.
[tool.pytest.ini_options]
markers = [
    "slow: takes >1s; deselect locally with -m 'not slow'",
]
