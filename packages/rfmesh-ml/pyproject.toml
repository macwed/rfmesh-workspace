# rfmesh-ml -- Workstream B: L3 edge ML emitter classification.
#
# Owned by Workstream B (Opus-B). Lead-only changes to this file.
# Workstream agents: propose dependency additions via /uvadd-request (AGENTS.md §3).
# Invariant 5: this package must be pure -- no network, no file I/O beyond loading
# model weights and threat profiles at import, no subprocess, no SDR access.

[project]
name = "rfmesh-ml"
version = "0.1.0"
description = "L3 edge ML emitter classification (STFT + CNN) and threat library for rfmesh."
requires-python = ">=3.12"
dependencies = [
    "rfmesh-contracts",
    "numpy>=2.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_ml", "threats"]
