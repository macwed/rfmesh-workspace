# rfmesh-node -- Workstream C+D: asyncio node runtime that wires SDR → DSP → bearer.
#
# Owned by Workstream C+D (Opus-CD). Lead-only changes to this file.
# Workstream agents: propose dependency additions via /uvadd-request (AGENTS.md §3).

[project]
name = "rfmesh-node"
version = "0.1.0"
description = "Asyncio node runtime: capability detection, pipeline wiring (SDR → DSP → bearer) for rfmesh."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "msgpack>=1.0",
    "pyyaml>=6.0",
    "rfmesh-contracts",
    # Composition root (ADR-011 D1): the node wires concrete siblings.
    # rfmesh-dsp = L1/L2 estimators; rfmesh-sdr = RTLSDRDevice (field L1);
    # rfmesh-servo = ServoDriver for the L1 sweep. import-linter exempts
    # rfmesh_node from the star-independence contract for exactly this.
    "rfmesh-dsp",
    "rfmesh-sdr",
    "rfmesh-servo",
]

[project.scripts]
rfmesh-node = "rfmesh_node.cli.run_node:run_node_main"
rfmesh-fusion-server = "rfmesh_node.cli.run_fusion:run_fusion_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_node"]
