[project]
name = "rfmesh-node"
version = "0.1.0"
description = "Asyncio node runtime: capability detection, pipeline wiring (SDR → DSP → bearer) for rfmesh."
requires-python = ">=3.12"
dependencies = [
    "rfmesh-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_node"]
