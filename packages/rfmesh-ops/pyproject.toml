# rfmesh-ops -- Workstream C+D: live ops dashboard and deployment tooling.
#
# Owned by Workstream C+D (Opus-CD). Lead-only changes to this file.
# Workstream agents: propose dependency additions via /uvadd-request (AGENTS.md §3).

[project]
name = "rfmesh-ops"
version = "0.1.0"
description = "Live ops dashboard (nodes, bearings, fixes, GDOP heatmap) and deployment tooling for rfmesh."
requires-python = ">=3.12"
dependencies = [
    "rfmesh-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_ops"]
