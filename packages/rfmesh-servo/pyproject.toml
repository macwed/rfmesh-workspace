# rfmesh-servo -- Workstream A: host-side servo driver and antenna sweep control.
#
# Owned by Workstream A (Opus-A). Lead-only changes to this file.
# Workstream agents: propose dependency additions via /uvadd-request (AGENTS.md §3).

[project]
name = "rfmesh-servo"
version = "0.1.0"
description = "Host-side servo driver (UART) and antenna sweep control for rfmesh L1 nodes."
requires-python = ">=3.12"
dependencies = [
    "rfmesh-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_servo"]
