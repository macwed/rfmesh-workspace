# rfmesh-sdr -- Workstream A: SDR hardware adapters and synthetic simulator.
#
# Owned by Workstream A (Opus-A). Lead-only changes to this file.
# Workstream agents: propose dependency additions via /uvadd-request (AGENTS.md §3).

[project]
name = "rfmesh-sdr"
version = "0.1.0"
description = "SDR hardware adapters (RTL-SDR, HackRF, bladeRF, Pluto+) and SyntheticReceiver for rfmesh."
readme = "README.md"
requires-python = ">=3.12"
# Runtime: numpy for IQ math; rfmesh-contracts for Protocols and config types.
# pydantic is available transitively through rfmesh-contracts. No hardware
# libraries (SoapySDR / rtlsdr / pyadi-iio / etc.) are runtime dependencies of
# the simulator path -- they are added per hardware-backed Receiver ticket.
dependencies = [
    "rfmesh-contracts",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_sdr"]
