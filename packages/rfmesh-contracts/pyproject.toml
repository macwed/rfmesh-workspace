# rfmesh-contracts -- the frozen interface layer of the rfmesh project.
#
# This is a workspace member package. It is intentionally minimal: its only
# runtime dependencies are pydantic (data contracts) and numpy (the IQ type
# aliases in protocols.py). It must never grow a dependency on another rfmesh
# package -- it is the root of the dependency star, not a node in it.
#
# Adding a dependency here is a lead-only action and, like any contract change,
# goes through an ADR. A workstream agent proposing a new dependency to this
# package writes a /uvadd-request and stops (see AGENTS.md).

[project]
name = "rfmesh-contracts"
version = "1.0.0"  # tracks SCHEMA_VERSION in src/rfmesh_contracts/version.py
description = "Frozen interface layer (data + behavioural contracts) for the rfmesh emitter-geolocation mesh."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfmesh_contracts"]

# Tooling config (ruff / mypy / pytest) is inherited from the workspace-root
# pyproject.toml. Nothing package-specific is needed or wanted here -- uniform
# gates across every workstream are part of the governance model.
