; PlatformIO build configuration for the rfmesh LoRa reference beacon.
; See firmware-beacon/lora_beacon_spec.md for the binding RF + payload
; contract; firmware-beacon/README.md for the flash + verify procedure.
;
; Build: pio run
; Flash: pio run -t upload
; Monitor (115200 8N1): pio device monitor

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; RadioLib drives the SX1276 over SPI. Pin map is fixed in main.cpp
; per the spec §4 (ESP32 GPIO 5 / 14 / 4 / 2 for NSS / RESET / DIO0 /
; DIO1).
lib_deps =
    jgromes/RadioLib @ ^6.6.0

; -DRFMESH_BEACON_BUILD lets the source guard against accidental inclusion
; in a non-beacon target (a future ticket may add a second env that builds
; with different defaults).
build_flags =
    -DRFMESH_BEACON_BUILD=1
    -Wall
    -Wextra
