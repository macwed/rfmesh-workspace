# rfmesh — uv workspace root.
#
# This file makes the repository a uv workspace: one lockfile, one .venv,
# many member packages each with their own pyproject.toml. See:
# https://docs.astral.sh/uv/concepts/projects/workspaces/
#
# Adding a new workspace member: drop a new pyproject.toml under packages/
# and (because the glob below covers packages/*) it is picked up automatically
# on the next `uv sync`.
#
# Editing this file is a lead-only action. Workstream agents do not modify
# the workspace root; they own only packages/<their-package>/ and below.

[project]
name = "rfmesh-workspace"
version = "0.0.0"
description = "rfmesh — cooperative bearing mesh for RF emitter geolocation (BoTH3 Counter-Jamming Challenge 2)."
requires-python = ">=3.12"
# Workspace root depends on its member packages so `uv sync` installs them
# all editable into the shared .venv. New member packages are added here
# AND under [tool.uv.workspace] members.
dependencies = [
    "rfmesh-contracts",
    "rfmesh-sdr",
    "rfmesh-servo",
    "rfmesh-dsp",
    "rfmesh-ml",
    "rfmesh-fusion",
    "rfmesh-cot",
    "rfmesh-node",
    "rfmesh-ops",
]

[tool.uv.sources]
# Each workspace member is sourced from its own subdirectory rather than
# from a registry. Add a line per package as workstreams deliver them.
rfmesh-contracts = { workspace = true }
rfmesh-sdr      = { workspace = true }
rfmesh-servo    = { workspace = true }
rfmesh-dsp      = { workspace = true }
rfmesh-ml       = { workspace = true }
rfmesh-fusion   = { workspace = true }
rfmesh-cot      = { workspace = true }
rfmesh-node     = { workspace = true }
rfmesh-ops      = { workspace = true }

# The workspace root is a "virtual" project (no source of its own). Members
# carry the real code. We list the contracts package explicitly above so
# `uv sync` resolves the editable install for everyone; the glob below
# makes new workstream packages discoverable.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",       # property-based tests in tests/property/
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.11",
    "pydeps>=3.0.6",
    "types-pyyaml>=6.0.12.20260510",
]

# ----------------------------------------------------------------------------
# Tool configuration is inherited workspace-wide — same gates everywhere is
# part of the governance model (AGENTS.md §5: every package passes ruff +
# mypy + pytest before declaring a ticket done).
# ----------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".claude/worktrees",
    "packages/*/vendor/",
    "firmware/build/",
]

[tool.ruff.lint]
# Conservative on day one. Workstreams may propose extending this set via
# ADR; tightening here is fine, loosening is a lead-only decision.
extend-select = [
    "E", "F", "I", "N", "UP", "B", "RUF", "PL", "SIM",
    "ANN",   # type annotations on public surface
    "S",     # bandit security checks
]
ignore = [
    "PLR0913",   # too many arguments — Pydantic models legitimately have many
    "S101",      # assert in tests — pytest needs assert
    "ANN401",    # Any in protocol return types when unavoidable
]
per-file-ignores = { "tests/**" = ["S", "ANN", "PLR2004"] }

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
# Each package owns its own src/ and tests/ roots; the two flags below stop
# mypy from collapsing every package's tests/ directory into one shared
# "tests" module (which would fail with a duplicate-module-name error as
# soon as two packages add tests/__init__.py). See WS-CD-001b.
explicit_package_bases = true
namespace_packages = true
exclude = [
    "packages/[^/]+/vendor/",
    "firmware/build/",
    "packages/[^/]+/tests/",
]

# Per-package overrides go in each package's own pyproject.toml when needed.

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "hardware: requires real SDR hardware (deselect with -m 'not hardware')",
    "slow: takes >1s; deselect locally with -m 'not slow'",
]

[tool.coverage.run]
branch = true
source = ["packages"]
omit = [
    "*/vendor/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.importlinter]
include_external_packages = true
root_packages = [
    "rfmesh_contracts",
    "rfmesh_sdr",
    "rfmesh_servo",
    "rfmesh_dsp",
    "rfmesh_ml",
    "rfmesh_fusion",
    "rfmesh_cot",
    "rfmesh_node",
    "rfmesh_ops",
]

[[tool.importlinter.contracts]]
name = "Star dependency: non-composition packages are independent"
type = "independence"
modules = [
    "rfmesh_sdr",
    "rfmesh_servo",
    "rfmesh_dsp",
    "rfmesh_ml",
    "rfmesh_fusion",
    "rfmesh_cot",
    "rfmesh_ops",
    # NOTE: rfmesh_node is the composition root and is intentionally
    # NOT in this list -- it imports from every sibling above by design
    # (Receiver / BearingEstimator / Bearer / Fuser / CotPublisher).
    # See ADR-011 D1 and docs/design/ops-architecture.md §1.3.
]
# WS-B-005 exception (ticket criterion 9): the L3 modulation classifier
# in rfmesh_ml consumes the salvaged STFT primitive from rfmesh_dsp as
# its feature-extraction entry point. Treated as a sibling-internal
# dependency rather than a star-graph violation -- this allowance was
# the only one until ADR-011 D2 added the rfmesh_ops -> rfmesh_dsp.l2_null_steering
# carve-out below.
ignore_imports = [
    "rfmesh_ml.features -> rfmesh_dsp.spectrum",
]

# ADR-011 D1: rfmesh_node may import every sibling package EXCEPT the
# dashboard. Nodes do not run dashboards.
[[tool.importlinter.contracts]]
name = "Node runtime: composition root must not import the dashboard"
type = "forbidden"
source_modules = ["rfmesh_node"]
forbidden_modules = ["rfmesh_ops"]

# ADR-011 D2: rfmesh_ops imports exactly one module from rfmesh_dsp
# (l2_null_steering.compute_receive_pattern, per ADR-008 §D7 / ADR-010).
# The carve-out is expressed by forbidding every OTHER rfmesh_dsp submodule
# -- the omitted one (l2_null_steering) is the allowed import.
[[tool.importlinter.contracts]]
name = "Ops imports only the null-steering pattern from DSP"
type = "forbidden"
source_modules = ["rfmesh_ops"]
forbidden_modules = [
    "rfmesh_dsp.l1",
    "rfmesh_dsp.l2_music",
    "rfmesh_dsp.l2_mvdr",
    "rfmesh_dsp.steering",
    "rfmesh_dsp.spectrum",
    "rfmesh_dsp.rssi",
]

[[tool.importlinter.contracts]]
name = "DSP is pure"
type = "forbidden"
source_modules = ["rfmesh_dsp"]
forbidden_modules = ["requests", "httpx", "aiohttp", "socket", "subprocess"]

[[tool.importlinter.contracts]]
name = "Fusion is pure"
type = "forbidden"
source_modules = ["rfmesh_fusion"]
forbidden_modules = ["requests", "httpx", "aiohttp", "socket", "subprocess"]

[[tool.importlinter.contracts]]
name = "ML is pure"
type = "forbidden"
source_modules = ["rfmesh_ml"]
forbidden_modules = ["requests", "httpx", "aiohttp", "socket", "subprocess"]
