server {
    listen 80;
    server_name both3.huplo.cc;

    # Cloudflare terminates TLS upstream; we trust X-Forwarded-Proto from it.
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Future-proof for a WebSocket swap of the REST polling.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Map for the Connection header (empty unless the client requested an upgrade).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
