# both3-poc backend — PoC web ops layer for rfmesh.
#
# This is a PoC-LOCAL package living entirely under deployment/. It is NOT a
# uv workspace member and must not be added to the workspace-root pyproject.
# It reuses two governed packages (rfmesh-cot, rfmesh-contracts) read-only by
# pip-installing them from the streamed Docker build context. See the Dockerfile
# for the install order (contracts first, then cot).

[project]
name = "both3-poc"
version = "0.1.0"
description = "PoC interactive map + CoT/TAK send + ingest API for rfmesh FixEvents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mgrs>=1.5",
    "numpy>=1.26",
    # rasterio + shapely power the LiDAR/DEM read and the HDR polygonizer; they
    # are imported lazily (try/except) so the package degrades without them, but
    # the deployed image installs them. rfmesh-cot + rfmesh-contracts are
    # installed by the Dockerfile from the build context (path installs), not
    # resolved from PyPI. Listed here only for documentation.
    "rfmesh-fusion",
    "rfmesh-node",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "numpy>=1.26",
    "httpx>=0.28.1",
    "anyio>=4.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/both3_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
rfmesh-fusion = { path = "../../packages/rfmesh-fusion", editable = true }
rfmesh-node = { path = "../../packages/rfmesh-node", editable = true }
