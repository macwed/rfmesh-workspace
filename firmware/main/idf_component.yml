## Managed-component dependencies for the firmware/main component.
##
## ESP32-C6 build needs no extra managed components: USB-Serial-JTAG is
## provided by the IDF-native `esp_driver_usb_serial_jtag` (listed in the
## component's REQUIRES). The C6 target was added in IDF v5.1; pin to that
## floor to match the prior C3 build baseline.

dependencies:
  idf:
    version: ">=5.1"
