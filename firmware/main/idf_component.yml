## Managed-component dependencies for the firmware/main component.
##
## esp_tinyusb provides the TinyUSB stack + the CDC ACM helper used by
## main.c and the stdio-routing helper used by shell.c. Pinned to the
## 1.4.x line which targets ESP-IDF v5.1+ (matches the prior C3 build's
## v5.4.3 baseline per README.md).

dependencies:
  espressif/esp_tinyusb: "~1.4.0"
  idf:
    version: ">=5.1"
